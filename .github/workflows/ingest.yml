name: Ingestar corrida de Adidas (Hooksy)

# Lo dispara el Cloudflare Worker cuando Hooksy manda una corrida, vía:
#   POST /repos/OWNER/REPO/dispatches
#   { "event_type": "nueva_corrida", "client_payload": { date, dist, ritmo, fc, start, end } }
on:
  repository_dispatch:
    types: [nueva_corrida]

permissions:
  contents: write

# Sin 'concurrency': el Worker dispara varias corridas casi a la vez y la
# concurrencia podía CANCELAR ingestas pendientes (perdiendo corridas). En su
# lugar, el paso de abajo es idempotente y reintenta desde el remoto fresco.

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ingestar y publicar (robusto ante escrituras concurrentes)
        env:
          RUN_DATE:  ${{ github.event.client_payload.date }}
          RUN_DIST:  ${{ github.event.client_payload.dist }}
          RUN_RITMO: ${{ github.event.client_payload.ritmo }}
          RUN_FC:    ${{ github.event.client_payload.fc }}
          RUN_START: ${{ github.event.client_payload.start }}
          RUN_END:   ${{ github.event.client_payload.end }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7; do
            # Partir SIEMPRE del último estado remoto y re-aplicar (ingest_run.py
            # agrega si falta / actualiza si existe) → sin rebase, sin conflictos.
            git fetch -q origin main
            git reset -q --hard origin/main
            python ingest_run.py
            git add imported_runs.json
            if git diff --cached --quiet; then
              echo "Nada que cambiar (ya estaba ingestada)."
              exit 0
            fi
            git commit -q -m "Ingestar corrida de Adidas ($(date -u +%Y-%m-%dT%H:%M))"
            if git push -q origin HEAD:main; then
              echo "Publicada (intento $i)."
              exit 0
            fi
            echo "Push rechazado por carrera; reintento desde remoto fresco ($i)..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "No se pudo publicar tras 7 intentos."
          exit 1
